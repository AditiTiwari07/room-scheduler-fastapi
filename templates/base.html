<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Scheduler</title>
    <link type="text/css" rel="stylesheet" href="{{ url_for('static', path='/style.css') }}"/>
    <script type="module" src="{{ url_for('static', path='/firebase-login.js') }}"></script>
</head>
<body>
    <nav>
        <h1>🏢 Room Scheduler</h1>
        <div>
            <div id="login-box" hidden="true">
                <input type="text" id="email" placeholder="Email"/>
                <input type="password" id="password" placeholder="Password"/>
                <button id="login">Login</button>
                <button id="sign-up">Sign Up</button>
            </div>
            <button id="sign-out" hidden="true" class="delete-btn">Sign Out</button>
        </div>
    </nav>

    <div class="container">
        {% if user_token %}
        <div class="user-info">
            <span>👤 Logged in as: <strong>{{ user_token.email }}</strong></span>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
