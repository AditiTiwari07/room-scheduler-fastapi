<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Scheduler</title>
    <link type="text/css" rel="stylesheet" href="{{ url_for('static', path='/style.css') }}"/>
    <script type="module" src="{{ url_for('static', path='/firebase-login.js') }}"></script>
</head>
<body>
    <nav>
        <h1>Room Scheduler</h1>
    </nav>
    <div class="container">
        <div id="login-box" hidden="true" class="login-box">
            <h3>Login / Sign Up</h3>
            Email:<input type="text" name="" id="email"/><br/>
            Password:<input type="password" name="" id="password"/><br/>
            <button id="login">Login</button>
            <button id="sign-up">Sign Up</button>
        </div>
        <button id="sign-out" hidden="true" class="delete-btn">Sign out</button>

        {% if user_token %}
            <p>Logged in as: <strong>{{ user_token.email }}</strong></p>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
